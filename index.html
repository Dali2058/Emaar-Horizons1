<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Emaar Horizons | إعمار هورايزونز</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#0b0b0f;--mid:#6b6b78;--bg:#faf9ff;--green:#7c3aed;--soft:#a78bfa;--navy:#0b0b0f;--ksa:#006c35;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden}
html[lang=en] body{font-family:'Montserrat','Tajawal',sans-serif}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,.card:focus-visible{outline:2px solid var(--green);outline-offset:3px}
svg.i{width:1em;height:1em;display:block}
/* intro */
#intro{position:fixed;inset:0;z-index:300;color:#fff;overflow:hidden;font-family:'Montserrat','Tajawal',sans-serif}
#intro.done{display:none}
.hv{position:absolute;top:0;bottom:0;width:50.3%;background:#49856c;transition:transform 1.2s var(--ease)}
.hv.l{left:0}.hv.r{right:0}
#intro.open .hv.l{transform:translateX(-102%)}#intro.open .hv.r{transform:translateX(102%)}
.i-c{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .5s}
#intro.open .i-c{opacity:0}
.frame{position:absolute;inset:16% 10%;width:80%;height:68%;opacity:0;animation:fr 3s .2s both}
.frame path{fill:none;stroke:rgba(255,255,255,.55);stroke-width:2;vector-effect:non-scaling-stroke}
@keyframes fr{0%{opacity:0;transform:scale(1.15)}20%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(.6)}}
#i-stage{display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .9s var(--ease),opacity .7s,filter .7s}
#intro.pull #i-stage{transform:scale(.25);opacity:0;filter:blur(8px)}
#intro.pull .frame{display:none}
.w{display:block;font-weight:800;font-size:clamp(2.2rem,8vw,5.4rem);line-height:1.15;letter-spacing:-1px;animation:cam 1.1s var(--ease) both}
@keyframes cam{0%{opacity:0;transform:translateY(90px) scale(2.4);filter:blur(16px)}55%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
#i-ready{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0;transform:scale(.85);transition:opacity .9s var(--ease),transform .9s var(--ease);pointer-events:none}
#intro.ready #i-ready{opacity:1;transform:none}
#i-ready p{font-size:clamp(1rem,2.6vw,1.5rem);font-weight:300;letter-spacing:4px;text-transform:uppercase}
html[lang=ar] #i-ready p{letter-spacing:0;text-transform:none;font-weight:500}
#i-ready img{height:clamp(54px,10vw,92px);filter:brightness(0) invert(1)}
#skip{position:absolute;bottom:26px;inset-inline-end:6%;z-index:2;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:99px;padding:6px 18px;font:500 .8rem inherit;font-family:inherit;cursor:pointer}
#skip:hover{background:rgba(255,255,255,.15)}
#bar{position:fixed;top:0;inset-inline-start:0;height:3px;width:0;background:linear-gradient(90deg,var(--soft),var(--green));z-index:90}
/* nav */
#nav{position:fixed;top:0;inset-inline:0;z-index:50;height:72px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;gap:14px;color:#fff;transition:background .35s,color .35s,box-shadow .35s}
#nav.solid{background:rgba(255,255,255,.92);backdrop-filter:blur(18px);color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand img{height:40px;transition:filter .35s}
#nav:not(.solid) .brand img{filter:brightness(0) invert(1)}
.sep{width:1px;height:28px;background:currentColor;opacity:.3}
.ksa{display:flex;align-items:center;gap:8px}
.ksa .b{width:36px;height:36px;border-radius:50%;background:var(--ksa);color:#fff;display:grid;place-items:center;padding:7px;border:1.5px solid rgba(255,255,255,.7)}
.ksa .b svg{width:100%;height:100%}
.ksa small{font-size:.62rem;line-height:1.25;font-weight:600;letter-spacing:.3px;max-width:78px}
@media(max-width:1100px){.ksa small{display:none}}
.links{display:flex;gap:2px;list-style:none}
.links a{padding:8px 12px;border-radius:99px;font-weight:500;font-size:.85rem;transition:background .25s;white-space:nowrap}
.links a:hover{background:rgba(124,58,237,.2)}
.nr{display:flex;align-items:center;gap:10px}
.lang{height:40px;padding:0 16px;border-radius:99px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:inherit;font:700 .85rem 'Tajawal','Montserrat',sans-serif;cursor:pointer;transition:background .25s}
.lang:hover{background:var(--green);border-color:var(--green);color:#fff}
#nav.solid .lang{border-color:rgba(124,58,237,.35);background:rgba(124,58,237,.08)}
#nav.solid .lang:hover{background:var(--green);color:#fff}
.burger{display:none;width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:inherit;cursor:pointer;place-items:center;font-size:24px}
#nav.solid .burger{border-color:rgba(124,58,237,.3);background:rgba(124,58,237,.08)}
@media(max-width:1000px){.links{display:none}.burger{display:grid}}
/* drawer */
#drawer{position:fixed;inset:0;z-index:120;background:rgba(11,11,15,.98);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 9%;transform:translateX(100%);visibility:hidden;transition:transform .55s var(--ease),visibility .55s}
#drawer.open{transform:none;visibility:visible}
#drawer .dx{position:absolute;top:13px;inset-inline-start:6%;width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:24px}
#drawer a{display:flex;align-items:center;gap:16px;font-size:1.25rem;font-weight:700;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);opacity:0;transform:translateX(30px);transition:.5s var(--ease)}
#drawer.open a{opacity:1;transform:none}
#drawer a span.ic{width:42px;height:42px;border-radius:12px;background:rgba(124,58,237,.25);color:var(--soft);display:grid;place-items:center;font-size:22px}
#drawer a:hover{color:var(--soft)}
/* hero */
#hero{position:relative;height:100vh;min-height:620px;display:flex;align-items:flex-end;color:#fff;background:#111 url(https://i.postimg.cc/13vmWFzf/0369fc75-767f-444b-a834-0a56132945fd.jpg) center/cover}
#hero::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(20,6,45,.85) 0%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.4) 100%)}
.hero-in{position:relative;padding:0 6% 9vh;max-width:800px}
.hero-in h1{font-weight:900;font-size:clamp(2rem,5vw,3.9rem);line-height:1.2;margin-bottom:18px}
.hero-in h1 em{font-style:normal;background:linear-gradient(90deg,#c4b5fd,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-in p{font-weight:300;font-size:1.05rem;max-width:540px;color:rgba(255,255,255,.88);margin-bottom:30px}
body.go .hero-in{animation:up 1s .3s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.btn{display:inline-block;padding:14px 34px;border-radius:99px;font-weight:700;background:var(--green);color:#fff;transition:transform .3s,background .3s;box-shadow:0 10px 30px rgba(124,58,237,.35)}
.btn:hover{transform:translateY(-3px);background:#6d28d9}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.6);margin-inline-start:10px;box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.14)}
.scroll{position:absolute;bottom:26px;inset-inline-end:6%;width:26px;height:44px;border:2px solid rgba(255,255,255,.6);border-radius:99px}
.scroll::after{content:'';position:absolute;top:8px;left:50%;width:4px;height:8px;margin-left:-2px;border-radius:4px;background:#fff;animation:wheel 1.8s infinite}
@keyframes wheel{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(16px)}}
@media(max-width:600px){.scroll{display:none}}
/* sections + dashboard */
.sec{padding:80px 6% 20px}
.head{max-width:760px;margin-bottom:40px}
.head h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:900;line-height:1.35;margin-bottom:10px}
.head h2::after{content:'';display:block;width:64px;height:5px;border-radius:9px;background:var(--green);margin-top:12px}
.head p{color:var(--mid);font-size:1rem}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
.stag1{transition-delay:.08s}.stag2{transition-delay:.16s}.stag3{transition-delay:.24s}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.kpis{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid rgba(124,58,237,.14);border-top:4px solid var(--green);border-radius:6px;padding:22px;box-shadow:0 10px 30px rgba(11,11,15,.05)}
.kpi.dk{background:var(--navy);color:#fff;border-color:rgba(167,139,250,.3);border-top-color:var(--soft)}
.k-top{display:flex;justify-content:space-between;align-items:center;font:600 .72rem 'Montserrat',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--mid)}
.dk .k-top{color:rgba(255,255,255,.65)}
.live{display:inline-flex;align-items:center;gap:6px}
.live::before{content:'';width:8px;height:8px;border-radius:50%;background:#22c55e;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}60%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}
.k-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.k-num{font:800 clamp(2rem,3.4vw,2.8rem) 'Montserrat',sans-serif;line-height:1;direction:ltr}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:rgba(124,58,237,.14)}.dk .ring .bg{stroke:rgba(255,255,255,.12)}
.ring .fg{stroke:var(--green);stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset 2s var(--ease)}
.dk .ring .fg{stroke:var(--soft)}
.ring .orb{position:absolute;inset:-5px;border-radius:50%;border:1.5px dashed rgba(124,58,237,.45);animation:rot 14s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.k-lbl{font-weight:700;font-size:.98rem;margin-bottom:12px}
.spark{display:flex;align-items:flex-end;gap:4px;height:34px}
.spark i{flex:1;background:linear-gradient(to top,var(--green),var(--soft));border-radius:2px 2px 0 0;height:30%;animation:bars 2.4s ease-in-out infinite}
.spark i:nth-child(2){animation-delay:-.3s}.spark i:nth-child(3){animation-delay:-.6s}.spark i:nth-child(4){animation-delay:-.9s}.spark i:nth-child(5){animation-delay:-1.2s}.spark i:nth-child(6){animation-delay:-1.5s}.spark i:nth-child(7){animation-delay:-1.8s}.spark i:nth-child(8){animation-delay:-2.1s}
@keyframes bars{0%,100%{height:25%}50%{height:100%}}
.panel{background:#fff;border:1px solid rgba(124,58,237,.14);border-radius:6px;box-shadow:0 10px 30px rgba(11,11,15,.05);overflow:hidden}
.row{display:grid;grid-template-columns:54px 1.1fr 2fr 64px;align-items:center;gap:20px;padding:22px 26px;border-bottom:1px solid rgba(124,58,237,.1)}
.row:last-child{border-bottom:0}
.row .ic{width:50px;height:50px;border-radius:10px;background:rgba(124,58,237,.1);color:var(--green);display:grid;place-items:center;font-size:26px;animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
.row h3{font-size:1.05rem;font-weight:800;line-height:1.3}.row small{color:var(--mid);font-size:.85rem}
.meter{height:10px;border-radius:99px;background:rgba(124,58,237,.12);overflow:hidden}
.meter b{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--soft),var(--green));position:relative;overflow:hidden;transition:width 2s var(--ease)}
.meter b::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shim 2.2s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.pct{font:800 1.2rem 'Montserrat',sans-serif;text-align:end;direction:ltr}
@media(max-width:760px){.row{grid-template-columns:50px 1fr 54px;gap:14px;padding:18px}.row .meter{grid-column:1/-1;order:5}}
/* projects */
#projects{padding:90px 0 100px}
#projects .head{padding:0 6%}
.marquee{overflow:hidden;direction:ltr;padding:24px 0;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.marquee:active{cursor:grabbing}
.track{display:flex;width:max-content;will-change:transform}
.card{flex:none;width:clamp(240px,24vw,340px);margin:0 12px;cursor:pointer;transition:transform .5s var(--ease),filter .5s,opacity .5s;background:none;border:0;text-align:start;font:inherit;color:inherit}
html[dir=rtl] .card{direction:rtl}
.card .ph{aspect-ratio:3/4;overflow:hidden;background:#ddd;border-radius:18px}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.card h3{font-size:1.05rem;font-weight:800;margin-top:14px}
.card small{color:var(--mid);font-size:.9rem}
.track:has(.card:hover) .card:not(:hover){filter:grayscale(1);opacity:.55}
.card:hover{transform:scale(1.07);z-index:2}
.hint{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mid);font-size:.88rem;margin-top:6px}
.hint svg{font-size:20px;color:var(--green);animation:sway 1.6s ease-in-out infinite}
@keyframes sway{50%{transform:translateX(8px)}}
/* catalogue: full bleed */
#catalogue{padding:0;background:#fff;line-height:0}
#catalogue img{display:block;width:100%;height:auto}
/* modal */
#modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(8,6,14,.95);color:#fff;flex-direction:column;padding:22px 5% 18px}
#modal.open{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.m-top h3{font-size:1.5rem;font-weight:800}.m-top p{color:rgba(255,255,255,.6);font-size:.92rem}
.x{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;font-size:1.3rem;cursor:pointer;flex:none}
.x:hover{background:rgba(255,255,255,.12)}
.stage{flex:1;min-height:0;display:flex;align-items:center;gap:14px;padding:14px 0}
.stage img{flex:1;min-width:0;height:100%;object-fit:contain}
.nv{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;font-size:1.2rem;cursor:pointer;flex:none}
.nv:hover{background:var(--green);border-color:var(--green)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.thumbs img{height:64px;width:90px;object-fit:cover;flex:none;cursor:pointer;opacity:.45;transition:opacity .2s;border-bottom:3px solid transparent}
.thumbs img.on{opacity:1;border-color:var(--green)}
/* footer */
footer{background:#b8a1f5;color:#0b0b0f;border-top:5px solid var(--ksa)}
.f-main{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:40px;padding:50px 6% 36px}
.f-brand img.lg{height:44px;filter:brightness(0);margin-bottom:16px}
.f-ksa{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.f-ksa .b{width:46px;height:46px;border-radius:50%;background:var(--ksa);color:#fff;padding:9px;flex:none}
.f-ksa .b svg{width:100%;height:100%}
.f-ksa strong{display:block;font-size:.95rem;line-height:1.3}
.f-brand p{font-size:.88rem;max-width:340px;color:rgba(0,0,0,.75)}
footer h4{font:800 .78rem 'Montserrat',sans-serif;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
html[lang=ar] footer h4{letter-spacing:0;font-size:.95rem}
footer ul{list-style:none;display:grid;gap:8px;font-size:.92rem}
footer ul a:hover{text-decoration:underline}
footer .tel{display:inline-block;direction:ltr;font:700 1rem 'Montserrat',sans-serif;color:#fff;padding:10px 22px;border-radius:99px;background:var(--navy)}
.f-bot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 6%;border-top:1px solid rgba(0,0,0,.22);font-size:.85rem;color:#0b0b0f}
.dev{display:flex;align-items:center;gap:12px}
.dev img{height:28px;filter:brightness(0)}
@media(max-width:800px){.f-main{grid-template-columns:1fr}.f-bot{justify-content:center;text-align:center}}
#fab{position:fixed;bottom:22px;inset-inline-start:22px;z-index:60;width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:26px;box-shadow:0 12px 30px rgba(124,58,237,.5);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,58,237,.55)}70%{box-shadow:0 0 0 18px rgba(124,58,237,0)}100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="intro">
  <div class="hv l"></div><div class="hv r"></div>
  <div class="i-c">
    <svg class="frame" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 12V0h8M92 0h8v12M100 88v12h-8M8 100H0V88"/></svg>
    <div id="i-stage"></div>
    <div id="i-ready"><p id="i-q"></p><img src="emmar.png" alt="Emaar Horizons"/></div>
  </div>
  <button id="skip" data-t="skip"></button>
</div>
<div id="bar"></div>

<nav id="nav">
  <div class="brand">
    <a href="/"><img src="emmar.png" alt="Emaar Horizons"/></a>
    <span class="sep"></span>
    <span class="ksa"><span class="b" id="emb1"></span><small data-t="kingdom"></small></span>
  </div>
  <ul class="links" id="links"></ul>
  <div class="nr"><button class="lang" id="lang1"></button><button class="burger" id="burger" aria-label="Menu"></button></div>
</nav>
<div id="drawer"><button class="dx" id="dx" aria-label="Close"></button></div>

<header id="hero">
  <div class="hero-in">
    <h1 id="h1"></h1>
    <p data-t="heroP"></p>
    <a href="#projects" class="btn" data-t="btn1"></a><a href="#contact" class="btn ghost" data-t="btn2"></a>
  </div>
  <div class="scroll"></div>
</header>

<section class="sec">
  <div class="head rv"><h2 data-t="dashT"></h2><p data-t="dashP"></p></div>
  <div class="kpis" id="kpis"></div>
</section>

<section class="sec" id="services">
  <div class="head rv"><h2 data-t="svcT"></h2><p data-t="svcP"></p></div>
  <div class="panel rv" id="svc"></div>
</section>

<section id="projects">
  <div class="head rv"><h2 data-t="projT"></h2><p data-t="projP"></p></div>
  <div class="marquee" id="marquee"><div class="track" id="track"></div></div>
  <div class="hint"><span id="harr"></span><span data-t="hint"></span></div>
</section>

<section id="catalogue">
  <img src="catalogue/part-01.jpg" alt="Emaar Horizons catalogue 1" width="1200" height="4000" decoding="async"/>
  <img src="catalogue/part-02.jpg" alt="Emaar Horizons catalogue 2" width="1200" height="4000" loading="lazy" decoding="async"/>
  <img src="catalogue/part-03.jpg" alt="Emaar Horizons catalogue 3" width="1200" height="4000" loading="lazy" decoding="async"/>
  <img src="catalogue/part-04.jpg" alt="Emaar Horizons catalogue 4" width="1200" height="4000" loading="lazy" decoding="async"/>
  <img src="catalogue/part-05.jpg" alt="Emaar Horizons catalogue 5" width="1200" height="4000" loading="lazy" decoding="async"/>
  <img src="catalogue/part-06.jpg" alt="Emaar Horizons catalogue 6" width="1200" height="4000" loading="lazy" decoding="async"/>
  <img src="catalogue/part-07.jpg" alt="Emaar Horizons catalogue 7" width="1200" height="4000" loading="lazy" decoding="async"/>
  <img src="catalogue/part-08.jpg" alt="Emaar Horizons catalogue 8" width="1200" height="4000" loading="lazy" decoding="async"/>
  <img src="catalogue/part-09.jpg" alt="Emaar Horizons catalogue 9" width="1200" height="4000" loading="lazy" decoding="async"/>

}
$('lang1').onclick=()=>setLang(lang==='en'?'ar':'en');
$('burger').onclick=()=>setD(true);$('dx').onclick=()=>setD(false);
drawer.addEventListener('click',e=>{if(e.target.closest('a'))setD(false)});

/* marquee */
const mq=$('marquee');
let pos=0,v=0,dir=-1,hover=false,setW=0,drag=false,moved=0,sx=0,sp=0,lx=0,vel=0;
const measure=()=>setW=track.scrollWidth/3;
addEventListener('load',measure);addEventListener('resize',measure);
mq.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hover=true});
mq.addEventListener('pointerleave',()=>hover=false);
mq.addEventListener('pointerdown',e=>{drag=true;moved=0;sx=lx=e.clientX;sp=pos;vel=0});
addEventListener('pointermove',e=>{if(!drag)return;moved=Math.max(moved,Math.abs(e.clientX-sx));vel=e.clientX-lx;lx=e.clientX;pos=sp+(e.clientX-sx)});
addEventListener('pointerup',()=>{if(drag){drag=false;v=Math.max(-40,Math.min(40,vel))}});
addEventListener('pointercancel',()=>{drag=false});
setInterval(()=>dir*=-1,14000);
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function loop(){
  if(!drag){v+=((hover||still?0:dir*0.6)-v)*0.05;pos+=v}
  if(setW){while(pos<=-setW)pos+=setW;while(pos>0)pos-=setW}
  track.style.transform=`translate3d(${pos}px,0,0)`;
  requestAnimationFrame(loop);
})();

/* modal */
let cur=null,idx=0;
const subtitle=()=>$('m-sub').textContent=(cur.c?cur.c[lang]+' · ':'')+cur.i.length+' '+I[lang].photos;
function show(i){
  idx=(i+cur.i.length)%cur.i.length;
  $('m-img').src=cur.i[idx];$('m-img').alt=cur.n[lang];
  [...$('m-thumbs').children].forEach((t,j)=>t.classList.toggle('on',j===idx));
  $('m-thumbs').children[idx].scrollIntoView({inline:'center',block:'nearest'});
}
function openP(k){
  cur=projects[k];$('m-title').textContent=cur.n[lang];subtitle();
  $('m-thumbs').innerHTML=cur.i.map((s,j)=>`<img src="${s}" alt="" data-j="${j}" loading="lazy"/>`).join('');
  $('modal').classList.add('open');document.body.style.overflow='hidden';show(0);
}
function closeP(){$('modal').classList.remove('open');document.body.style.overflow=''}
track.addEventListener('click',e=>{if(moved>6)return;const c=e.target.closest('.card');if(c)openP(c.dataset.k%projects.length)});
$('m-thumbs').addEventListener('click',e=>{if(e.target.dataset.j)show(+e.target.dataset.j)});
const rtl=()=>document.documentElement.dir==='rtl';
$('m-next').onclick=()=>show(idx+1);$('m-prev').onclick=()=>show(idx-1);$('m-close').onclick=closeP;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeP()});
addEventListener('keydown',e=>{if(e.key==='Escape')setD(false);if(!cur||!$('modal').classList.contains('open'))return;
  if(e.key==='Escape')closeP();
  if(e.key==='ArrowRight')show(idx+(rtl()?-1:1));if(e.key==='ArrowLeft')show(idx+(rtl()?1:-1))});

/* scroll */
const nav=$('nav'),bar=$('bar'),hero=$('hero');
addEventListener('scroll',()=>{
  nav.classList.toggle('solid',scrollY>60);
  bar.style.width=(scrollY/(document.body.scrollHeight-innerHeight)*100)+'%';
  if(scrollY<innerHeight)hero.style.backgroundPositionY=`calc(50% + ${scrollY*0.25}px)`;
});

/* cinematic intro */
setLang(lang);
const intro=$('intro');let fin=false;
function finish(){if(fin)return;fin=true;intro.classList.add('open');document.body.classList.add('go');setTimeout(()=>{intro.classList.add('done');document.body.style.overflow=''},1300)}
if(still){intro.classList.add('done');document.body.classList.add('go')}
else{
  document.body.style.overflow='hidden';
  const T=I[lang];
  $('i-stage').innerHTML=T.words.map((w,k)=>`<span class="w" style="animation-delay:${.3+k*.85}s">${w}</span>`).join('');
  $('i-q').textContent=T.ready;
  const t1=.3+T.words.length*.85+.9;
  setTimeout(()=>intro.classList.add('pull'),t1*1000);
  setTimeout(()=>intro.classList.add('ready'),t1*1000+700);
  setTimeout(finish,t1*1000+3000);
  $('skip').onclick=finish;
}
</script>
</body>
</html>
